<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연구했니? Streak Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8f7f2;
      --card: #ffffff;
      --ink: #222222;
      --muted: #777777;
      --line: #e8e3d7;
      --accent: #f4b942;
      --accent-dark: #d99000;
      --danger: #d84a4a;
      --ok: #2f9e44;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #fff4cf 0, #f8f7f2 35%, #eef5ff 100%);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .app { width: 100%; max-width: 760px; }

    header { margin-bottom: 20px; text-align: center; }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0;
      letter-spacing: -0.06em;
    }

    .subtitle { margin-top: 8px; color: var(--muted); font-size: 1rem; }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(70, 54, 20, 0.08);
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .hidden { display: none !important; }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 1rem;
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(244, 185, 66, 0.25);
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--ink);
      color: white;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .secondary { background: #eee8d8; color: var(--ink); }
    .danger { background: var(--danger); }

    .big-check {
      width: 100%;
      padding: 22px;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--accent), #ff7a59);
      color: #1d1400;
      margin: 14px 0;
    }

    .status { min-height: 24px; color: var(--muted); font-size: 0.95rem; margin-top: 10px; }
    .small { font-size: 0.85rem; color: var(--muted); }

    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nickname { font-size: 1.4rem; font-weight: 900; }
    .streak-number { font-size: 3.5rem; line-height: 1; font-weight: 950; letter-spacing: -0.08em; }
    .streak-label { color: var(--muted); font-weight: 700; }

    .today-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 8px 12px;
      background: #f2ead8;
      color: #5d4500;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .today-badge.done { background: #dff4e5; color: #126a2c; }

    .leaderboard-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }

    .leaderboard-title h2 { margin: 0; font-size: 1.35rem; }
    .leaderboard-list { display: grid; gap: 10px; }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fffdf8;
    }

    .rank {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f1ead8;
      font-weight: 900;
    }

    .person-name { font-weight: 900; margin-bottom: 5px; }
    .dots { word-break: break-all; line-height: 1.55; letter-spacing: 0.05em; }
    .score { font-weight: 950; font-size: 1.2rem; }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 18px;
    }

    .top-actions {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(70, 54, 20, 0.12);
      font-size: 1.35rem;
    }

    .side-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      z-index: 30;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(360px, 92vw);
      height: 100vh;
      background: var(--card);
      border-left: 1px solid var(--line);
      box-shadow: -18px 0 45px rgba(0, 0, 0, 0.12);
      z-index: 40;
      padding: 22px;
      transform: translateX(110%);
      transition: transform 0.18s ease;
      overflow-y: auto;
    }

    .side-menu.open { transform: translateX(0); }

    .side-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .side-header h2 { margin: 0; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .emoji-option {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      font-size: 1.35rem;
      padding: 0;
    }

    .emoji-option.selected {
      outline: 3px solid rgba(244, 185, 66, 0.42);
      border-color: var(--accent);
      background: #fff5d3;
    }

    .preview-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 18px;
      background: #fff9e8;
      border: 1px solid var(--line);
    }

    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .card { padding: 18px; border-radius: 20px; }
      .leaderboard-item { grid-template-columns: 36px 1fr; }
      .score { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <button id="menuBtn" class="icon-button top-actions hidden" aria-label="프로필 메뉴 열기">☰</button>
  <div id="sideBackdrop" class="side-backdrop hidden"></div>

  <aside id="sideMenu" class="side-menu" aria-label="프로필 설정">
    <div class="side-header">
      <h2>프로필 설정</h2>
      <button id="closeMenuBtn" class="icon-button" aria-label="프로필 메뉴 닫기">×</button>
    </div>

    <label for="profileNickname">닉네임</label>
    <input id="profileNickname" type="text" placeholder="리더보드에 표시될 이름" />

    <label for="profileEmoji">표시 이모지</label>
    <input id="profileEmoji" type="text" maxlength="8" placeholder="🔥" inputmode="text" />
    <p class="small">폰에서는 이 칸을 누르고 키보드의 이모지 버튼으로 직접 입력하면 됨. 아래 빠른 선택도 가능.</p>
    <div id="emojiGrid" class="emoji-grid"></div>

    <div class="preview-box">
      <div class="small">미리보기</div>
      <div><strong id="profilePreviewName">-</strong>: <span id="profilePreviewDots"></span></div>
    </div>

    <div class="button-row">
      <button id="saveProfileBtn">저장</button>
    </div>
    <div id="profileStatus" class="status"></div>
  </aside>

  <main class="app">
    <header>
      <h1>연구했니?</h1>
      <div class="subtitle">오늘 연구했으면 찍고 가라. 도망은 DB에 기록된다.</div>
    </header>

    <section id="authCard" class="card">
      <h2 id="authTitle">로그인</h2>
      <p class="small">기본은 로그인. 회원가입을 누르면 닉네임 입력칸이 열림.</p>

      <label for="email">이메일</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <label for="password">비밀번호</label>
      <input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" />

      <div id="nicknameBlock" class="hidden">
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" placeholder="리더보드에 표시될 이름" />
      </div>

      <div class="button-row">
        <button id="loginBtn">로그인</button>
        <button id="signupToggleBtn" class="secondary">회원가입</button>
        <button id="signupConfirmBtn" class="secondary hidden">가입하기</button>
      </div>

      <div id="authStatus" class="status"></div>
    </section>

    <section id="mainCard" class="card hidden">
      <div class="profile-row">
        <div>
          <div class="small">현재 사용자</div>
          <div id="currentNickname" class="nickname">-</div>
        </div>
        <div id="todayBadge" class="today-badge">오늘 아직 안 함</div>
      </div>

      <button id="checkBtn" class="big-check">오늘 연구했다 ✍️</button>
      <button id="undoCheckBtn" class="secondary hidden">오늘 기록 취소</button>

      <div class="profile-row">
        <div>
          <div class="streak-label">내 현재 streak</div>
          <div><span id="myStreak" class="streak-number">0</span> 일</div>
        </div>
        <button id="logoutBtn" class="danger">로그아웃</button>
      </div>

      <div id="mainStatus" class="status"></div>
    </section>

    <section id="leaderboardCard" class="card hidden">
      <div class="leaderboard-title">
        <h2>Leaderboard</h2>
        <button id="refreshBtn" class="secondary">새로고침</button>
      </div>
      <div id="leaderboard" class="leaderboard-list"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://rsxrylszfhzxiegdczzc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzeHJ5bHN6Zmh6eGllZ2RjenpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzE5ODksImV4cCI6MjA5MzU0Nzk4OX0.DGaN6Zsp1ukleEm7NDhGgWma4-6Acma98VSy3mJ6tgQ";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage
      }
    });
    const $ = (id) => document.getElementById(id);

    const authCard = $("authCard");
    const mainCard = $("mainCard");
    const leaderboardCard = $("leaderboardCard");
    const emailInput = $("email");
    const passwordInput = $("password");
    const nicknameInput = $("nickname");
    const authStatus = $("authStatus");
    const mainStatus = $("mainStatus");
    const currentNickname = $("currentNickname");
    const todayBadge = $("todayBadge");
    const checkBtn = $("checkBtn");
    const undoCheckBtn = $("undoCheckBtn");
    const myStreak = $("myStreak");
    const leaderboard = $("leaderboard");
    const menuBtn = $("menuBtn");
    const sideMenu = $("sideMenu");
    const sideBackdrop = $("sideBackdrop");
    const closeMenuBtn = $("closeMenuBtn");
    const profileNickname = $("profileNickname");
    const emojiGrid = $("emojiGrid");
    const profileEmoji = $("profileEmoji");
    const saveProfileBtn = $("saveProfileBtn");
    const profileStatus = $("profileStatus");
    const profilePreviewName = $("profilePreviewName");
    const profilePreviewDots = $("profilePreviewDots");
    const signupToggleBtn = $("signupToggleBtn");
    const signupConfirmBtn = $("signupConfirmBtn");
    const nicknameBlock = $("nicknameBlock");
    const authTitle = $("authTitle");

    const emojiOptions = ["🔥", "☀️", "🌙", "⭐", "🌱", "🌿", "🍀", "🧠", "📚", "✍️", "📝", "💻", "🐣", "🐦", "🐈", "🦊", "🍊", "☕"];
    let selectedEmoji = "🔥";
    let currentUser = null;
    let currentProfile = null;
    let todayLogId = null;
    let isBooting = true;
    let isLoadingSession = false;

    function todayKST() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function dateMinusDaysKST(days) {
      const now = new Date();
      now.setDate(now.getDate() - days);
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(now);
    }

    function setStatus(el, message, isError = false) {
      el.textContent = message;
      el.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function buildEmojiGrid() {
      emojiGrid.innerHTML = emojiOptions.map((emoji) => `
        <button type="button" class="emoji-option" data-emoji="${emoji}" aria-label="${emoji} 선택">${emoji}</button>
      `).join("");

      emojiGrid.querySelectorAll(".emoji-option").forEach((button) => {
        button.addEventListener("click", () => {
          selectedEmoji = button.dataset.emoji;
          profileEmoji.value = selectedEmoji;
          renderEmojiSelection();
          updateProfilePreview();
        });
      });
    }

    function renderEmojiSelection() {
      emojiGrid.querySelectorAll(".emoji-option").forEach((button) => {
        button.classList.toggle("selected", button.dataset.emoji === selectedEmoji);
      });
    }

    function updateProfilePreview() {
      const name = profileNickname.value.trim() || currentProfile?.nickname || "익명의 연구자";
      const typedEmoji = profileEmoji.value.trim() || "🔥";
      selectedEmoji = typedEmoji;
      const streak = Math.max(Number(myStreak.textContent || 0), 1);
      profilePreviewName.textContent = `${selectedEmoji} ${name}`;
      profilePreviewDots.textContent = selectedEmoji.repeat(Math.min(streak, 20));
      renderEmojiSelection();
    }

    function syncProfileForm() {
      if (!currentProfile) return;
      profileNickname.value = currentProfile.nickname || "";
      selectedEmoji = currentProfile.emoji || "🔥";
      profileEmoji.value = selectedEmoji;
      renderEmojiSelection();
      updateProfilePreview();
    }

    function openSideMenu() {
      syncProfileForm();
      sideMenu.classList.add("open");
      sideBackdrop.classList.remove("hidden");
    }

    function closeSideMenu() {
      sideMenu.classList.remove("open");
      sideBackdrop.classList.add("hidden");
      setStatus(profileStatus, "");
    }

    async function upsertProfile(userId, nickname, emoji = "🔥") {
      const { error } = await client
        .from("profiles")
        .upsert({ id: userId, nickname: nickname || "익명의 연구자", emoji: emoji || "🔥" }, { onConflict: "id" });
      if (error) throw error;
    }

    async function getProfile(user) {
      const { data, error } = await client
        .from("profiles")
        .select("id, nickname, emoji")
        .eq("id", user.id)
        .single();

      if (error && error.code !== "PGRST116") throw error;
      if (data) return { ...data, emoji: data.emoji || "🔥" };

      const fallbackName = user.user_metadata?.nickname || user.email?.split("@")[0] || "익명의 연구자";
      await upsertProfile(user.id, fallbackName, "🔥");
      return { id: user.id, nickname: fallbackName, emoji: "🔥" };
    }

    async function signUp() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const nickname = nicknameInput.value.trim();

      if (!email || !password || !nickname) {
        setStatus(authStatus, "이메일, 비밀번호, 닉네임 다 넣어야 함.", true);
        return;
      }

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { nickname } }
      });

      if (error) {
        setStatus(authStatus, error.message, true);
        return;
      }

      if (data.user) await upsertProfile(data.user.id, nickname, "🔥");
      setStatus(authStatus, "회원가입 완료. 이메일 인증을 켜둔 경우 메일함을 확인해야 함.");
      await loadSession();
    }

    async function login() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      setStatus(authStatus, "로그인 시도 중...");

      if (!email || !password) {
        setStatus(authStatus, "이메일과 비밀번호를 넣어줘.", true);
        return;
      }

      if (SUPABASE_URL.includes("YOUR_SUPABASE") || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE")) {
        setStatus(authStatus, "Supabase URL 또는 anon key가 아직 기본값임. 실제 값으로 바꿔야 함.", true);
        return;
      }

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          setStatus(authStatus, `로그인 실패: ${error.message}`, true);
          console.error("Login error:", error);
          return;
        }

        if (!data.session) {
          setStatus(authStatus, "로그인 응답은 왔는데 세션이 없음. 이메일 인증 설정을 확인해봐.", true);
          console.warn("Login data without session:", data);
          return;
        }

        setStatus(authStatus, "로그인 성공.");
        currentUser = data.session.user;
        renderLoadingLoggedIn();
        currentProfile = await getProfile(currentUser);
        renderLoggedIn();
        await refreshAll();
      } catch (err) {
        setStatus(authStatus, `로그인 중단: ${err.message}`, true);
        console.error("Unexpected login exception:", err);
      }
    }

    async function logout() {
      await client.auth.signOut();
      currentUser = null;
      currentProfile = null;
      renderLoggedOut();
    }

    async function saveProfile() {
      if (!currentUser) return;
      const nickname = profileNickname.value.trim();
      const emoji = profileEmoji.value.trim() || "🔥";
      selectedEmoji = emoji;

      if (!nickname) {
        setStatus(profileStatus, "닉네임은 비워둘 수 없음.", true);
        return;
      }

      saveProfileBtn.disabled = true;
      setStatus(profileStatus, "저장 중...");

      const { data, error } = await client
        .from("profiles")
        .update({ nickname, emoji })
        .eq("id", currentUser.id)
        .select("id, nickname, emoji")
        .single();

      if (error) {
        setStatus(profileStatus, error.message, true);
      } else {
        currentProfile = { ...data, emoji: data.emoji || "🔥" };
        currentNickname.textContent = `${currentProfile.emoji} ${currentProfile.nickname}`;
        setStatus(profileStatus, "저장됨. 리더보드에도 반영됨.");
        await refreshLeaderboard();
      }

      saveProfileBtn.disabled = false;
    }

    async function loadSession() {
      if (isLoadingSession) return;
      isLoadingSession = true;
      try {
        const { data, error } = await client.auth.getSession();

        if (error || !data.session) {
          currentUser = null;
          currentProfile = null;
          renderLoggedOut();
          return;
        }

        currentUser = data.session.user;
        renderLoadingLoggedIn();

        currentProfile = await getProfile(currentUser);
        renderLoggedIn();

        await refreshAll();
      } catch (err) {
        console.error("loadSession failed", err);
        renderLoggedOut();
        setStatus(authStatus, `세션/프로필 로딩 실패: ${err.message}`, true);
      } finally {
        isBooting = false;
        isLoadingSession = false;
      }
    }

    function renderLoadingLoggedIn() {
      authCard.classList.add("hidden");
      mainCard.classList.remove("hidden");
      leaderboardCard.classList.remove("hidden");
      menuBtn.classList.remove("hidden");
      currentNickname.textContent = "불러오는 중...";
      todayBadge.textContent = "확인 중";
      todayBadge.classList.remove("done");
      checkBtn.disabled = true;
      leaderboard.innerHTML = `<div class="empty">리더보드 불러오는 중...</div>`;
    }

    function renderLoggedOut() {
      authCard.classList.remove("hidden");
      mainCard.classList.add("hidden");
      leaderboardCard.classList.add("hidden");
      menuBtn.classList.add("hidden");
      closeSideMenu();
      setStatus(authStatus, "");
    }

    function renderLoggedIn() {
      authCard.classList.add("hidden");
      mainCard.classList.remove("hidden");
      leaderboardCard.classList.remove("hidden");
      menuBtn.classList.remove("hidden");
      currentNickname.textContent = `${currentProfile.emoji || "🔥"} ${currentProfile.nickname}`;
      syncProfileForm();
    }

    async function hasCheckedToday(userId) {
      const { data, error } = await client
        .from("research_logs")
        .select("id")
        .eq("user_id", userId)
        .eq("log_date", todayKST())
        .maybeSingle();
      if (error) throw error;
      todayLogId = data?.id || null;
      return Boolean(data);
    }

    async function checkToday() {
      if (!currentUser) return;
      checkBtn.disabled = true;
      undoCheckBtn.disabled = true;
      setStatus(mainStatus, "기록 중...");

      const { error } = await client
        .from("research_logs")
        .insert({ user_id: currentUser.id, log_date: todayKST() });

      if (error) {
        if (error.code === "23505") setStatus(mainStatus, "오늘은 이미 찍었음. 양심 DB 정상 작동 중.");
        else setStatus(mainStatus, error.message, true);
      } else {
        setStatus(mainStatus, "좋다. 오늘 연구한 사람으로 기록됨.");
      }

      await refreshAll();
    }

    async function undoCheckToday() {
      if (!currentUser) return;
      undoCheckBtn.disabled = true;
      checkBtn.disabled = true;
      setStatus(mainStatus, "오늘 기록 취소 중...");

      const { error } = await client
        .from("research_logs")
        .delete()
        .eq("user_id", currentUser.id)
        .eq("log_date", todayKST());

      if (error) {
        setStatus(mainStatus, `취소 실패: ${error.message}`, true);
      } else {
        setStatus(mainStatus, "오늘 기록 취소됨. 다시 찍을 수 있음.");
      }

      await refreshAll();
    }

    async function getUserLogs(userId) {
      const { data, error } = await client
        .from("research_logs")
        .select("log_date")
        .eq("user_id", userId)
        .order("log_date", { ascending: false });
      if (error) throw error;
      return data.map((row) => row.log_date);
    }

    function calculateCurrentStreak(logDates) {
      const dateSet = new Set(logDates);
      let streak = 0;
      for (let i = 0; i < 3650; i++) {
        const target = dateMinusDaysKST(i);
        if (dateSet.has(target)) streak += 1;
        else break;
      }
      return streak;
    }

    async function refreshMine(logs = null) {
      const checked = await hasCheckedToday(currentUser.id);
      todayBadge.textContent = checked ? "오늘 연구함" : "오늘 아직 안 함";
      todayBadge.classList.toggle("done", checked);
      checkBtn.classList.toggle("hidden", checked);
      undoCheckBtn.classList.toggle("hidden", !checked);
      checkBtn.disabled = checked;
      undoCheckBtn.disabled = !checked;

      const userLogs = logs || await getUserLogs(currentUser.id);
      myStreak.textContent = calculateCurrentStreak(userLogs);
      updateProfilePreview();
    }

    async function refreshLeaderboard() {
      const { data, error } = await client
        .from("leaderboard_view")
        .select("user_id, nickname, emoji, total_count, current_streak")
        .order("current_streak", { ascending: false })
        .order("total_count", { ascending: false })
        .limit(30);

      if (error) {
        leaderboard.innerHTML = `<div class="empty">리더보드를 불러오지 못함: ${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!data.length) {
        leaderboard.innerHTML = `<div class="empty">아직 아무도 연구하지 않았다. 음산하다.</div>`;
        return;
      }

      leaderboard.innerHTML = data.map((row, index) => {
        const emoji = row.emoji || "🔥";
        const dots = emoji.repeat(Math.min(row.current_streak, 60));
        const suffix = row.current_streak > 60 ? ` +${row.current_streak - 60}` : "";
        return `
          <div class="leaderboard-item">
            <div class="rank">${index + 1}</div>
            <div>
              <div class="person-name">${emoji} ${escapeHtml(row.nickname)}</div>
              <div class="dots">${dots || "-"}${suffix}</div>
              <div class="small">총 ${row.total_count}일 기록</div>
            </div>
            <div class="score">${row.current_streak}일</div>
          </div>
        `;
      }).join("");
    }

    async function refreshAll() {
      if (!currentUser) return;
      const logs = await getUserLogs(currentUser.id);
      await Promise.all([
        refreshMine(logs),
        refreshLeaderboard()
      ]);
    }

    signupToggleBtn.addEventListener("click", () => {
      nicknameBlock.classList.remove("hidden");
      signupConfirmBtn.classList.remove("hidden");
      signupToggleBtn.classList.add("hidden");
      authTitle.textContent = "회원가입";
    });

    signupConfirmBtn.addEventListener("click", signUp);
    loginBtn.addEventListener("click", login);
    logoutBtn.addEventListener("click", logout);
    checkBtn.addEventListener("click", checkToday);
    undoCheckBtn.addEventListener("click", undoCheckToday);
    refreshBtn.addEventListener("click", refreshAll);
    menuBtn.addEventListener("click", openSideMenu);
    closeMenuBtn.addEventListener("click", closeSideMenu);
    sideBackdrop.addEventListener("click", closeSideMenu);
    saveProfileBtn.addEventListener("click", saveProfile);
    profileNickname.addEventListener("input", updateProfilePreview);
    profileEmoji.addEventListener("input", updateProfilePreview);

    client.auth.onAuthStateChange((event, session) => {
      if (isBooting) return;

      if (event === "SIGNED_OUT") {
        currentUser = null;
        currentProfile = null;
        renderLoggedOut();
        return;
      }

      if (event === "SIGNED_IN" && session?.user) {
        currentUser = session.user;
      }
    });

    buildEmojiGrid();
    loadSession();
  </script>
</body>
</html>
